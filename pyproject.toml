[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Local-first agent harness: DeepSeek tool-calling loop with pluggable tools and a web monitor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "cobra>=0.29",
    "jsonschema>=4.20",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.4",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests", "harness"]
asyncio_mode = "auto"
norecursedirs = [
    "project_assets",
    "archive",
    "docs",
    "frontend",
    "workspace",
    "workflow_runs",
    "runs",
    "scripts",
    "web",
    "synbio",
    "knowledge",
    ".git",
    "__pycache__",
    ".pytest_cache",
]
