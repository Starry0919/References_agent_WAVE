[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Local-first agent harness: DeepSeek tool-calling loop with pluggable tools and a web monitor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "cobra>=0.29",
]

[tool.setuptools.packages.find]
include = ["harness*"]
